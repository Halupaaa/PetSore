<header class="cart__header"><%- include('partial/nav.html') %></header>
<main class="cart__main">
    <h2>Your Cart</h2>

    <div class="product-details__cart">
        <div class="product-details__cart-items">
            <article class="product-details__cart-item">
                <img src="assets\catalog\item-temp.svg" alt="temp item" class="product-details__image"/>
                <div class="product-details__cart-item-info">
                    <h3 class="product-details__title">Grain-Free Chicken Dry Dog Food</h3>
                    <p class="product-details__size">Size: 10 kg</p>
                </div>
                <button class="product-details__button button-count">+ 1 -</button>
                <p class="product-details__price">₴1,240</p>
                <a href="#" class="product-details__button button-secondary">X</a>
            </article>
            <article class="product-details__cart-item">
                <img src="assets\catalog\item-temp.svg" alt="temp item" class="product-details__image"/>
                <div class="product-details__cart-item-info">
                    <h3 class="product-details__title">Salmon Cat Food</h3>
                    <p class="product-details__size">Size: 2 kg</p>
                </div>
                <button class="product-details__button button-count">+ 1 -</button>
                <p class="product-details__price">₴1,040</p>
                <a href="#" class="product-details__button button-secondary">X</a>
            </article>
            <article class="product-details__cart-item">
                <img src="assets\catalog\item-temp.svg" alt="temp item" class="product-details__image"/>
                <div class="product-details__cart-item-info">
                    <h3 class="product-details__title">Parrot Grain Mix</h3>
                    <p class="product-details__size">Size: 800 g</p>
                </div>
                <button class="product-details__button button-count">+ 1 -</button>
                <p class="product-details__price">₴180</p>
                <a href="#" class="product-details__button button-secondary">X</a>
            </article>
        </div>
        <article class="product-details__cart-summary">
            <h3 class="product-details__summary-title">Order Summary</h3>
            <div class="product-details__summary-item">
                <p class="product-details__summary-label">Subtotal</p>
                <p class="product-details__summary-value">₴2,460</p>
            </div>
            <div class="product-details__summary-item">
                <p class="product-details__summary-label">Shipping</p>
                <p class="product-details__summary-value">₴100</p>
            </div>
            <hr>
            <div class="product-details__summary-item">
                <p class="product-details__summary-label">Total</p>
                <p class="product-details__summary-value">₴2,560</p>
            </div>
            <a href="#" class="product-details__button button-primary">BUY</a>
        </article>
    </div>
</main>
<footer class="product-details__footer"><%- include('partial/footer.html') %></footer>
